<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virus Store</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
}

header{
    background:#00b894;
    padding:20px;
    text-align:center;
}

.games{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card{
    background:#222;
    width:250px;
    border-radius:10px;
    overflow:hidden;
    text-align:center;
}

.card img{
    width:100%;
}

.card h2{
    margin:10px 0;
}

.price{
    color:#00ff99;
    font-size:22px;
}

button{
    background:#00b894;
    color:white;
    border:none;
    padding:12px 20px;
    margin:15px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>

<body>

<header>
<h1>🎮 Virus Store</h1>
<p>بيع ألعاب Steam الأصلية بالجنيه المصري</p>
</header>

<div class="games">

<div class="card">
<img src="https://cdn.cloudflare.steamstatic.com/steam/apps/730/header.jpg" alt="CS2">
<h2>Counter-Strike 2</h2>
<p class="price">اطلب السعر</p>
<button>اطلب الآن</button>
</div>

<div class="card">
<img src="https://cdn.cloudflare.steamstatic.com/steam/apps/570/header.jpg" alt="Dota 2">
<h2>Dota 2</h2>
<p class="price">اطلب السعر</p>
<button>اطلب الآن</button>
</div>

<div class="card">
<img src="https://cdn.cloudflare.steamstatic.com/steam/apps/1091500/header.jpg" alt="Cyberpunk 2077">
<h2>Cyberpunk 2077</h2>
<p class="price">1200 جنيه</p>
<button>اطلب الآن</button>
</div>

</div>

</body>
</html>
